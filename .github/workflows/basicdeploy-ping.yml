name: BasicDeploy health ping

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Keep backend awake
        run: |
          curl --fail --silent --show-error --max-time 20 \
            "https://pzx9k1h2.basicdeploy.com/api/health"
